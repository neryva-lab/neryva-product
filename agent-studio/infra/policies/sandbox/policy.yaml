# sandbox policy — TARGET policy for the future real sandbox backend (E2B OSS /
# Daytona per docs/design/fl-2.11-sandbox-code-interpreter.md). NOT currently
# enforced: the present executor (executeInSimulatedSandbox) is an in-process
# simulation with no filesystem/network/CPU/memory isolation (Wave 3,
# 2026-09-23). Do not treat this ConfigMap as an enforced boundary.
# Source: 400-405, 1018-1029, 636-644
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-policy
data:
  policy.json: |
    {
      "workloadIdentity": "tool-worker-sandbox",
      "filesystemIsolation": "readOnlyRoot + emptyDir /tmp",
      "cpuLimit": "500m",
      "memoryLimit": "512Mi",
      "timeoutMs": 30000,
      "networkEgress": "deny-by-default",
      "allowedEgress": [],
      "ambientCredentials": "none",
      "audit": true
    }
