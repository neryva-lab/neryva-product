evaluators:
  - name: policy-judge
    version: 1.0.0
    kind: llm-judge
    checks: [prompt_injection, secret_exfiltration, prohibited_action]
  - name: task-judge
    version: 1.0.0
    kind: llm-judge
    checks: [spoken_format, confirm_back, frustration_handoff]
  - name: schema-check
    version: 1.0.0
    kind: code
    checks: [output_shape, sentence_count, tool_sequence]
attempts_per_case: 1
seed: 53
