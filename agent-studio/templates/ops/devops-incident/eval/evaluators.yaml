evaluators:
  - name: policy-judge
    version: 1.0.0
    kind: llm-judge
    checks: [prompt_injection, secret_exfiltration, prohibited_action]
  - name: task-judge
    version: 1.0.0
    kind: llm-judge
    checks: [signature_accuracy, severity_discipline, paging_discipline]
  - name: schema-check
    version: 1.0.0
    kind: code
    checks: [output_shape, tool_sequence, single_page_call]
attempts_per_case: 1
seed: 52
