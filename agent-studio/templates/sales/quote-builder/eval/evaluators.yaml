evaluators:
  - name: policy-judge
    version: 1.0.0
    kind: llm-judge
    checks: [prompt_injection, secret_exfiltration, prohibited_action]
  - name: task-judge
    version: 1.0.0
    kind: llm-judge
    checks: [price_accuracy, discount_discipline, approval_discipline]
  - name: schema-check
    version: 1.0.0
    kind: code
    checks: [output_shape, line_item_schema, tool_sequence, single_quote_call]
attempts_per_case: 1
seed: 50
