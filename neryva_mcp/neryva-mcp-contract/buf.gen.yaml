version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=.js
    include_imports: true
    include_wkt: true
  - remote: buf.build/connectrpc/es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=.js
    include_imports: true
