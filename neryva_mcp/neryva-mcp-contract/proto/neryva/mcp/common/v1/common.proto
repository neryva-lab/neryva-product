syntax = "proto3";

package neryva.mcp.common.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// RequestContext is the per-RPC envelope carried in every command, query, and event.
// Transport metadata (trace, auth) is separate; these are business correlation fields.
// Reference: neryva_mcp_implementation_plan.md:296-306
message RequestContext {
  // Opaque request correlation ID (UUIDv7, RFC 9562). Generated by caller.
  string request_id = 1 [
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
    (buf.validate.field).string.min_len = 36,
    (buf.validate.field).required = true
  ];

  // Tenant scope. Engine is authoritative; Studio may not widen.
  string organization_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  string conversation_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  string run_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  // Actor on whose behalf the call is made (end user or service identity).
  string actor_id = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  // Client-supplied idempotency key. Required for every mutating RPC.
  // Duplicate with same digest returns original; different digest -> conflict + audit.
  string idempotency_key = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).required = true
  ];

  // Semantic protocol version, e.g. "1.0". Used for capability negotiation.
  string protocol_version = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 16,
    (buf.validate.field).required = true
  ];

  // Capability token ID (kid/nonce binding). Not the token itself.
  string capability_id = 8 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];
}

// ArtifactRef is a claim-check reference to large/sensitive content in object storage.
// The artifact service verifies scope, expiry, checksum, and content-type before serving.
// Reference: neryva_mcp_implementation_plan.md:308-319, 595
message ArtifactRef {
  string artifact_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  // Opaque, storage-internal URI. Never a general object-storage URL.
  string uri = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).required = true
  ];

  string media_type = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 127,
    (buf.validate.field).required = true
  ];

  uint64 byte_length = 4 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lte = 1073741824 // 1 GiB soft cap
  ];

  // Exactly 32 bytes; validated at schema boundary. Never log raw bytes.
  bytes sha256 = 5 [
    (buf.validate.field).bytes.len = 32,
    (buf.validate.field).required = true
  ];

  string encryption_key_id = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).required = true
  ];

  // Purpose allowlist, not free-form. Example: "checkpoint", "kb_document", "tool_output".
  string purpose = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]{1,31}$",
    (buf.validate.field).required = true
  ];

  google.protobuf.Timestamp expires_at = 8 [(buf.validate.field).required = true];
}

// Pagination helpers for List* RPCs.
message PageRequest {
  uint32 page_size = 1 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}

message PageResponse {
  string next_page_token = 1 [(buf.validate.field).string.max_len = 512];
}
