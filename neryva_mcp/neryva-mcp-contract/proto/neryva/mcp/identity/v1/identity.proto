syntax = "proto3";

package neryva.mcp.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Workload identity + run-scoped capability.
// Production: mTLS + SPIFFE X.509-SVID preferred (JWT replayable).
// Capability is short-lived, audience-bound, scope-bound, replay-resistant.
// Reference: neryva_mcp_implementation_plan.md:668-693
message Capability {
  string capability_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  string audience = 2 [
    (buf.validate.field).string.const = "neryva-agent-studio",
    (buf.validate.field).required = true
  ];
  string organization_id = 3 [(buf.validate.field).string.min_len = 1];
  string conversation_id = 4 [(buf.validate.field).string.min_len = 1];
  string run_id = 5 [(buf.validate.field).string.min_len = 1];
  string assistant_version_id = 6 [(buf.validate.field).string.min_len = 1];
  string policy_version = 7 [(buf.validate.field).string.min_len = 1];
  repeated string allowed_operations = 8 [(buf.validate.field).repeated.min_items = 1];
  string nonce = 9 [
    (buf.validate.field).string.min_len = 16,
    (buf.validate.field).required = true
  ];
  string issuer = 10 [(buf.validate.field).string.min_len = 1];
  string kid = 11 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp issued_at = 12 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 13 [(buf.validate.field).required = true];
  uint64 lease_epoch = 14;
}

enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  IDENTITY_KIND_WORKLOAD = 1;
  IDENTITY_KIND_USER = 2;
  IDENTITY_KIND_OPERATOR = 3;
}
